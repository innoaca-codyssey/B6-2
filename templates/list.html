{% extends 'base.html' %}
{% block content %}
<h1>할 일 목록</h1>
<form method="get" action="/tasks"><label>제목 검색 <input name="q" value="{{ q }}" maxlength="100"></label><button>검색</button> <a href="/tasks">전체 보기</a></form>
<ul>{% for task in tasks %}<li><a href="/tasks/{{ task.id }}">{{ task.title }}</a></li>{% else %}<li>검색 조건에 맞는 할 일이 없습니다.</li>{% endfor %}</ul>
<a href="/tasks/new">새 할 일 등록</a>
{% endblock %}
